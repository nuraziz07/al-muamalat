<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/Images/Png/android-chrome-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/index.css">
    <title>Al-Muamalat</title>

    <style>
      .web-preloader {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        height: 100vh;
        width: 100vw;
        margin: auto;
        background-color: white;
        overflow: hidden;
        z-index: 1000000;

        &.hidden {
          opacity: 0;
          visibility: hidden;
        }
      }
      .preloader-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .preloader-circle {
        position: absolute;
        top: 50%;
        left: 50%;
        margin-left: -100px;
        margin-top: -100px;
        width: 200px;
        height: 200px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top: 6px dotted #009688;
        border-bottom: 6px dotted #009688;
        border-radius: 50%;
        animation: tax-spin 1.5s linear infinite;
      }

      .preloader-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: auto;
        width: 120px;
        height: 120px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        background-image: url("/src/assets/Images/Svg/Logo.svg");
      }

      @keyframes tax-spin  {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(-360deg);
        }
      }

    </style>
  </head>
  <body>

    <div class="web-preloader" id="web-preloader">
      <div class="preloader-container">
        <div class="preloader-circle"></div>
        <div class="preloader-logo"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
